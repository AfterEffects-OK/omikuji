<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おみくじルーレット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 和風フォント (Yusei Magic: 縦書き/タイトル, M PLUS 1p: 本文) -->
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=M+PLUS+1p:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS変数の定義 */
        :root {
            --primary-red: #953428;
            --secondary-red: #c0392b;
            --wood-color: #e0c8a8;
            --paper-bg: #fffff0;
            --gold-color: #ffc107;
        }

        /* グローバルな和風フォントと基本設定 - 背景強化 */
        body {
            font-family: 'M PLUS 1p', sans-serif;
            background-color: #fcfcfc;
            background-image: repeating-linear-gradient(
                45deg,
                #eee 0,
                #eee 2px,
                #fcfcfc 2px,
                #fcfcfc 25px
            );
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        /* コンテナ - 重厚な朱色と木の枠 */
        .omikuji-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--paper-bg);
            border-radius: 16px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                0 0 0 10px var(--wood-color),
                0 0 0 14px var(--primary-red);
            overflow: hidden;
            position: relative;
        }

        /* タイトルエリア */
        h1 {
            font-family: 'Yusei Magic', cursive;
            color: #4a4a4a;
            border-bottom: 3px solid #f0e6d2;
        }

        /* ルーレットと結果のフレックスコンテナ */
        .content-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 1rem;
        }

        /* ルーレット本体 (ドーナツチャート) - 枠を鳥居風に強化 */
        #roulette-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 2rem;
            border-radius: 50%;
            box-shadow: 
                0 0 0 10px var(--secondary-red),
                0 0 0 14px #fffae6,
                0 0 0 16px var(--primary-red);
            overflow: hidden; 
        }

        #roulette {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            will-change: transform;
            
            /* セクターカラーは維持 */
            background: conic-gradient(
                #FFB11B 0deg,   /* 大吉: 山吹色 (Yamabuki-iro) */
                #FFB11B 45deg,
                #808080 45deg,   /* 凶: 鈍色 (Nibiiro) */
                #808080 81deg,
                #E89C9A 81deg,   /* 中吉: 紅梅色 (Koubai-iro) */
                #E89C9A 171deg,
                #003366 171deg,  /* 大凶: 紺色 (Kon-iro) */
                #003366 189deg,
                #ED784A 189deg,  /* 小吉: 柿色 (Kaki-iro) */
                #ED784A 297deg,
                #66B2B2 297deg,  /* 末吉: 浅葱色 (Asagi-iro) */
                #66B2B2 360deg
            );
        }

        /* ルーレットの目印 (停止位置の矢印) */
        #pointer {
            position: absolute;
            top: -75px; 
            left: 50%;
            transform: translateX(-50%) scale(1.2); 
            width: 0;
            height: 0;
            border-left: 45px solid transparent; 
            border-right: 45px solid transparent;
            border-top: 80px solid var(--secondary-red);
            z-index: 10;
            filter: drop-shadow(0 8px 4px rgba(0, 0, 0, 0.4));
        }

        /* 運勢テキストの配置コンテナ */
        .fortune-text-container {
            position: absolute;
            width: 100%;
            height: 100%;
            font-family: 'Yusei Magic', cursive;
            font-size: 26px; 
            font-weight: 700;
            color: #5d251f;
            text-shadow: 1px 1px 0 #fff, 2px 2px 0 #fff;
            z-index: 5;
        }

        /* 各運勢のテキスト要素 - 縦書きと放射状配置 */
        .vertical-fortune {
            position: absolute;
            width: 100%;
            height: 100%;
            writing-mode: vertical-rl;
            transform-origin: center;
            display: flex; 
            align-items: center; /* 垂直方向（半径方向）に中央揃え */
            justify-content: flex-start;
            letter-spacing: 0.1em;
            
            /* 中心から文字を押し出す距離を調整。マイナス値で中心に近づける */
            padding-left: 0px; 
        }

        /* 回転ボタン - 豪華な黄金色と立体感を強調 */
        #spin-button {
            background-color: var(--gold-color);
            color: #8b4513;
            border-bottom: 6px solid #b8860b;
            transition: all 0.15s ease;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            font-size: 1.3rem;
            padding: 0.8rem 2.5rem;
            font-weight: 700;
        }
        #spin-button:hover {
            background-color: #ffd700;
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
        }
        #spin-button:active {
            border-bottom: 0;
            transform: translateY(6px);
        }

        /* 講義Navigatorへのリンクボタン */
        #navigator-link-button {
            background-color: var(--secondary-red);
            font-size: 1.2rem;
            padding: 0.8rem 2.5rem;
        }
        #navigator-link-button:hover {
            background-color: var(--primary-red);
            transform: scale(1.03);
        }

        /* 結果詳細表示エリア (おみくじ札デザイン) */
        #result-display {
            position: relative; /* 疑似要素の基準点にする */
            isolation: isolate; /* z-indexのスタッキングコンテキストを新しく作る */
            border: 5px solid #5d251f;
            background-color: var(--paper-bg);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ★追加: 透かし画像用の疑似要素 */
        #result-display::before {
            content: '';
            position: absolute;
            inset: 0; /* top, right, bottom, left を 0 に設定するのと同じ */
            background-image: url("https://github.com/AfterEffects-OK/omikuji/blob/main/%E3%82%B3%E3%83%B3%E3%83%9D%204_00000.png?raw=true");
            background-repeat: no-repeat;
            background-position: right 1rem bottom 1rem;
            background-size: 90px;
            opacity: 0.08; /* 画像の不透明度を調整 */
            z-index: -1; /* テキストの背面に配置 */
        }

        /* 運勢名表示エリア - 縦書きの強調（最高の迫力） */
        .omikuji-fortune {
            padding: 15px;
            border-bottom: 4px solid var(--primary-red); 
            height: 80px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Yusei Magic', cursive;
            font-size: 56px;
            letter-spacing: 0.2em;
            color: transparent; 
            transition: all 0.4s;
            writing-mode: horizontal-tb;
        }

        /* 運勢が確定した時のスタイル */
        .omikuji-fortune.omikuji-fortune-active {
            background-color: #ffe8d6;
            color: var(--secondary-red); 
            border-bottom: 4px solid var(--primary-red); 
            text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.9);
        }

        /* 本文スクロールエリア */
        #resultTextScroll {
            max-height: 400px; 
            overflow-y: auto;
            padding: 1.5rem;
            white-space: pre-wrap; 
            line-height: 2.0; 
            font-size: 18px;
            color: #333;
        }

        /* ローディングメッセージ */
        #loading-message {
            display: none;
            text-align: center;
            font-size: 1.3rem; 
            color: var(--primary-red);
            font-weight: 700;
        }

        /* モバイル対応 */
        @media (max-width: 640px) {
            .omikuji-container {
                padding: 1rem;
            }
            #roulette-wrapper {
                width: 280px;
                height: 280px;
            }
            .omikuji-fortune {
                font-size: 40px;
            }
            #spin-button {
                width: 100%;
                /* ★修正箇所★: ボタンテキストがはみ出さないようにフォントサイズを 1.0rem に縮小 */
                font-size: 1.0rem; 
            }
            #pointer {
                top: -55px; 
                border-left: 35px solid transparent; 
                border-right: 35px solid transparent;
                border-top: 65px solid var(--secondary-red);
            }
        }
    </style>
</head>

        // --- DOM要素の取得 ---
        const roulette = document.getElementById('roulette');
        const spinButton = document.getElementById('spin-button');
        const navigatorLinkButton = document.getElementById('navigator-link-button');
        const rouletteWrapper = document.getElementById('roulette-wrapper');
        const fortuneTextContainer = document.querySelector('.fortune-text-container');
        const resultDisplay = document.getElementById('result-display');
        const omikujiFortune = document.getElementById('omikuji-fortune');
        const resultTextScroll = document.getElementById('resultTextScroll');
        const loadingMessage = document.getElementById('loading-message');

        // 現在の総回転角度を保持する変数（必須）
        let totalRotation = 0;

        // おみくじを引いた回数と前回の運勢ランクを記録
        let drawCount = 0;
        let previousFortuneRank = 5; // 初回は最高ランク(大吉)と見なす
        
        // 回転時間（秒）
        const spinDuration = 6; 
        
        // 運勢テキストのレンダリング
        function renderFortuneTexts() {
            fortuneTextContainer.innerHTML = ''; // クリア
            FORTUNES_CONFIG.forEach((fortune, index) => {
                const centerAngle = (fortune.startAngle + fortune.endAngle) / 2;
                
                // 運勢名を表示するための要素を作成
                const div = document.createElement('div');
                div.className = 'vertical-fortune';
                div.textContent = fortune.name;
                
                // セクターの中心角度をそのまま回転角度として適用
                // CSSの padding-left で中心から文字を押し出し、位置を調整
                const rotation = centerAngle; 
                div.style.transform = `rotate(${rotation}deg)`;
                
                fortuneTextContainer.appendChild(div);
            });
        }

        // --- ルーレットをスピンさせる関数 ---
        async function spinRoulette() {
            // ★追加: ボタンクリック時にバイブレーション
            if (navigator.vibrate) {
                navigator.vibrate(50); // 50ミリ秒の振動
            }

            spinButton.disabled = true;
            spinButton.textContent = "運命の回転...";
            navigatorLinkButton.classList.add('hidden'); // リンクボタンを隠す
            resultDisplay.classList.add('hidden');
            loadingMessage.style.display = 'block';

            // ★追加: ルーレットが画面中央に来るようにスクロール
            rouletteWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // 1. 当選する運勢を決定する（確率に応じて）
            const randomChance = Math.random() * 360; // 0〜360のランダムな角度を生成
            let selectedFortune = null;
            let currentSumAngle = 0;

            // ランダム角度がどのセグメントに該当するかをチェック
            for (const fortune of FORTUNES_CONFIG) {
                if (randomChance >= currentSumAngle && randomChance < currentSumAngle + fortune.angle) {
                    selectedFortune = fortune;
                    break;
                }
                currentSumAngle += fortune.angle;
            }

            // 2. 停止角度を計算する
            // 決定したセグメントの中心角度をポインター（0度位置）に合わせるための最終的なルーレットの角度を計算
            const centerAngleOfFortune = (selectedFortune.startAngle + selectedFortune.endAngle) / 2;
            
            // ルーレットの0度マークが最終的にどこに位置すれば、選択された運勢がポインターの下に来るか
            const finalAlignmentAngle = (360 - centerAngleOfFortune) % 360;

            // 現在のルーレットの視覚的な角度 (0-359)
            const currentVisualRotation = totalRotation % 360;

            // 現在の視覚的な角度から、目標のfinalAlignmentAngleに到達するために必要な追加の回転量
            const rotationDelta = (finalAlignmentAngle - currentVisualRotation + 360) % 360;
            
            // 3. 総回転角度を累積する
            const spins = Math.floor(Math.random() * 6) + 5; // 5〜10回転
            const spinAngle = spins * 360;

            // 前回の総回転角度に、今回の回転角度（周回＋停止角度）を加算
            const newTotalRotation = totalRotation + spinAngle + rotationDelta;

            // 総回転角度を更新
            totalRotation = newTotalRotation;

            // 4. CSSアニメーションを適用
            // スピンアニメーションの速度を設定（CSS transitionプロパティを動的に設定）
            roulette.style.transition = `transform ${spinDuration}s cubic-bezier(0.2, 0.8, 0.4, 1)`;
            // 総回転角度を適用
            roulette.style.transform = `rotate(${totalRotation}deg)`;

            // 5. アニメーション終了を待って結果を表示
            await new Promise(resolve => setTimeout(resolve, spinDuration * 1000 + 500)); // 回転時間+余裕0.5秒

            loadingMessage.style.display = 'none';
            displayResult(selectedFortune);

            // --- ボタンの表示/非表示ロジックを先に実行 ---
            drawCount++;

            // 運勢が悪化した場合のみ、再度引くボタンを表示する
            if (selectedFortune.rank < previousFortuneRank) {
                spinButton.classList.remove('hidden');
                navigatorLinkButton.classList.remove('hidden');
            } else {
                spinButton.classList.add('hidden');
                navigatorLinkButton.classList.remove('hidden');
            }
            previousFortuneRank = selectedFortune.rank; // 今回のランクを次回のために保存
            spinButton.disabled = false; // ボタンの無効化を解除
            spinButton.textContent = "おみくじを引く"; // ボタンのテキストを元に戻す

            // 6. 結果表示エリアへ1秒後にスクロール
            await new Promise(resolve => setTimeout(resolve, 1000));
            const container = document.querySelector('.omikuji-container');
            container.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        // --- 結果を表示する関数 ---
        function displayResult(fortune) {
            // 運勢名を表示
            omikujiFortune.textContent = fortune.name;
            omikujiFortune.className = 'omikuji-fortune omikuji-fortune-active'; // スタイルをアクティブ化

            // 詳細テキストを表示
            // ランダムに一つの詳細メッセージを選択
            const randomIndex = Math.floor(Math.random() * fortune.detail.length);
            resultTextScroll.textContent = fortune.detail[randomIndex];

            // 結果エリアを表示
            resultDisplay.classList.remove('hidden');

            // スクロールをトップに戻す
            resultTextScroll.scrollTop = 0;
        }

        // --- 初期化とイベントリスナー ---
        window.onload = () => {
            renderFortuneTexts();
            spinButton.addEventListener('click', spinRoulette);

            // ★追加: 講義Navigatorボタンにもバイブレーションを追加
            navigatorLinkButton.addEventListener('click', () => {
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            });

            spinButton.classList.remove('hidden'); // 初期表示
            spinButton.textContent = "おみくじを引く";
            
            // 初回ロード時にルーレットのスタイルを初期化（念のため）
            roulette.style.transform = `rotate(0deg)`;
        };
    </script>
